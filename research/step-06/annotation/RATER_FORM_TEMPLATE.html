<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>TRUSTXAI offline rater form</title>
  <style>
    :root{--ink:#172033;--muted:#5f6b7a;--line:#d9e0e8;--panel:#fff;--accent:#1f6f5f;--soft:#eef7f4;--warn:#9b4d16}
    *{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
    header{position:sticky;top:0;z-index:3;background:#12221f;color:#fff;padding:12px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}header span{color:#cfe2dd}
    main{max-width:1320px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(400px,.72fr);gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 2px 8px #1720330b}.evidence{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto}
    h2,h3{margin:0 0 9px}h2{font-size:18px;margin-top:15px}h3{font-size:16px;margin-top:17px}.muted{color:var(--muted)}.banner{background:var(--soft);border-left:4px solid var(--accent);padding:9px 12px;margin-bottom:12px}
    .finding,.claim,.viewtext{white-space:pre-wrap;border:1px solid var(--line);border-radius:8px;padding:9px;margin:7px 0}.viewtext{background:#fbfcfd}.grid,.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin:9px 0}.field>label{display:block;font-weight:650;margin-bottom:4px}.checks label{font-weight:400}
    select,input[type=text],input[type=number],textarea{width:100%;border:1px solid #b8c3cf;border-radius:7px;background:#fff;padding:8px;color:var(--ink)}textarea{min-height:70px;resize:vertical}button,.button{border:1px solid #9cabb9;border-radius:7px;background:#fff;padding:8px 11px;cursor:pointer;color:var(--ink)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button:disabled{opacity:.5}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input{width:84px}.toolbar select{width:auto}.extra{border:1px dashed #aebac6;border-radius:8px;padding:9px;margin:8px 0}.danger{color:#8a2d20}.status{min-height:24px;color:var(--warn);font-weight:650}.saved{color:var(--accent)}.small{font-size:13px}
    @media(max-width:900px){main{grid-template-columns:1fr}.evidence{position:static;max-height:none}.grid,.checks{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><strong>TRUSTXAI offline annotation</strong><span id="assignment"></span><span id="counter"></span><span id="completion"></span></header>
<main>
  <section class="panel evidence">
    <div class="banner"><strong>Evidence-contract task.</strong> Judge only the displayed record. Do not diagnose, search opaque IDs, or use outside clinical knowledge.</div>
    <div id="itemMeta" class="muted"></div><h2>Case findings</h2><div id="findings"></div><h2>Evidence claims</h2><div id="claims"></div><h2>View 1</h2><div id="view1" class="viewtext"></div><h2>View 2</h2><div id="view2" class="viewtext"></div>
  </section>
  <section class="panel" id="responsePanel">
    <div class="toolbar"><button id="previous">Previous</button><button id="next" class="primary">Save &amp; next</button><button id="nextIncomplete">Next incomplete</button><label class="small">Jump <input id="jump" type="number" min="1"></label><select id="partitionJump"><option value="">Partition…</option><option value="development">Development</option><option value="test">Test</option></select></div>
    <div class="toolbar"><button id="saveProgress">Save progress</button><label class="button" for="loadProgress">Resume progress</label><input id="loadProgress" type="file" accept="application/json,.json" hidden><button id="exportDevelopment">Export development JSONL</button><button id="exportTest">Export test JSONL</button></div>
    <div class="field"><label for="raterId">Rater pseudonym (same on every row; format R-name)</label><input id="raterId" type="text" autocomplete="off" placeholder="R-your_pseudonym"></div><div id="status" class="status" role="status"></div>
    <div class="grid"><div class="field"><label for="reviewable">Reviewable</label><select id="reviewable"></select></div><div class="field"><label for="needsAdjudication">Needs adjudication</label><select id="needsAdjudication"></select></div></div>
    <div id="view1Form"></div><div id="view2Form"></div><div id="crossForm"></div><div class="field"><label for="notes">Notes / unresolved reason</label><textarea id="notes"></textarea></div>
  </section>
</main>
<script>
"use strict";
const ASSIGNMENT=__ASSIGNMENT_JSON__;
const CLAIMS=["C1","C2","C3","C4"], CLAIM_STATUS=["supported","contradicted","unsupported","missing","unresolved"], CROSS_STATUS=["preserved","changed","missing","unresolved"];
const FLAGS=["frozen_decision_changed","omission_generalized_to_all_edits","clinical_causation_claimed","internal_reasoning_claimed","confidence_invented","treatment_or_action_added","external_medical_fact_added","other"];
const TOP_KEYS=["schema_version","packet_id","item_id","rater_id","reviewable","view_1","view_2","cross_view","needs_adjudication","notes"], VIEW_KEYS=["C1_status","C2_status","C3_status","C4_status","extra_claim_present","extra_claims","scope_flags"], EXTRA_KEYS=["quote","status","reason"];
const rows=[];for(const partition of ["development","test"])for(const packet of ASSIGNMENT.partitions[partition])rows.push({partition,packet});
const packetIds=[...new Set(rows.map(x=>x.packet.packet_id))].sort(), itemIds=new Set(rows.map(x=>x.packet.item_id)), storageKey="trustxai-step6-"+ASSIGNMENT.rater_slot+"-"+packetIds.join("_");
let position=0, responses=Object.create(null), raterId="";

function sameKeys(object,expected){return object&&typeof object==="object"&&!Array.isArray(object)&&Object.keys(object).sort().join("|")===expected.slice().sort().join("|");}
function blankView(){return {C1_status:"",C2_status:"",C3_status:"",C4_status:"",extra_claim_present:"",extra_claims:[],scope_flags:[]};}
function blankResponse(packet){return {schema_version:"1.0",packet_id:packet.packet_id,item_id:packet.item_id,rater_id:"",reviewable:"",view_1:blankView(),view_2:blankView(),cross_view:{C1:"",C2:"",C3:"",C4:""},needs_adjudication:"",notes:""};}
function current(){const packet=rows[position].packet;if(!responses[packet.item_id])responses[packet.item_id]=blankResponse(packet);return responses[packet.item_id];}
function options(values,value){return '<option value="">Select…</option>'+values.map(v=>'<option value="'+v+'"'+(v===value?' selected':'')+'>'+v+'</option>').join("");}
function status(message,ok=false){const n=document.getElementById("status");n.textContent=message;n.className="status"+(ok?" saved":"");}
function textBox(className,value){const n=document.createElement("div");n.className=className;n.textContent=value==null?"":String(value);return n;}
function progress(){saveVisible();return {schema:"trustxai.step6.rater-form-progress.v1",rater_slot:ASSIGNMENT.rater_slot,packet_ids:packetIds,rater_id:raterId,responses:Object.values(responses)};}
function persistRaw(){try{localStorage.setItem(storageKey,JSON.stringify({schema:"trustxai.step6.rater-form-progress.v1",rater_slot:ASSIGNMENT.rater_slot,packet_ids:packetIds,rater_id:raterId,responses:Object.values(responses)}));}catch(_error){}}

function responseShape(row){if(!sameKeys(row,TOP_KEYS)||row.schema_version!=="1.0"||typeof row.packet_id!=="string"||typeof row.item_id!=="string"||typeof row.rater_id!=="string"||typeof row.reviewable!=="string"||typeof row.needs_adjudication!=="string"||typeof row.notes!=="string"||!sameKeys(row.cross_view,CLAIMS)||CLAIMS.some(x=>typeof row.cross_view[x]!=="string"))return false;for(const key of ["view_1","view_2"]){const view=row[key];if(!sameKeys(view,VIEW_KEYS)||!Array.isArray(view.extra_claims)||!Array.isArray(view.scope_flags)||CLAIMS.some(x=>typeof view[x+"_status"]!=="string")||typeof view.extra_claim_present!=="string"||view.scope_flags.some(x=>typeof x!=="string"))return false;if(view.extra_claims.some(x=>!sameKeys(x,EXTRA_KEYS)||typeof x.quote!=="string"||typeof x.status!=="string"||typeof x.reason!=="string"))return false;}return !JSON.stringify(row).includes("__FILL__");}
function bindingValid(row){if(!responseShape(row)||!itemIds.has(row.item_id))return false;const packet=rows.find(x=>x.packet.item_id===row.item_id).packet;return row.packet_id===packet.packet_id;}
function errors(row){const out=[];if(!responseShape(row))return ["invalid response structure"];if(!/^R-[A-Za-z0-9_-]+$/.test(row.rater_id))out.push("valid rater pseudonym");if(!["yes","no"].includes(row.reviewable))out.push("reviewable");if(!["yes","no"].includes(row.needs_adjudication))out.push("needs adjudication");let unresolved=false;for(const key of ["view_1","view_2"]){const view=row[key];for(const claim of CLAIMS){if(!CLAIM_STATUS.includes(view[claim+"_status"]))out.push(key+" "+claim);if(view[claim+"_status"]==="unresolved")unresolved=true;}if(!["yes","no","unresolved"].includes(view.extra_claim_present))out.push(key+" extra-claim choice");if(view.extra_claim_present==="yes"&&view.extra_claims.length===0)out.push(key+" extra-claim details");if(view.extra_claim_present==="no"&&view.extra_claims.length)out.push(key+" extra-claim mismatch");if(view.extra_claim_present==="unresolved")unresolved=true;for(const extra of view.extra_claims){if(!extra.quote.trim()||!["supported","contradicted","unsupported","unresolved"].includes(extra.status))out.push(key+" complete extra claim");if(extra.status==="unresolved")unresolved=true;}if(view.scope_flags.some(x=>!FLAGS.includes(x))||new Set(view.scope_flags).size!==view.scope_flags.length)out.push(key+" scope flags");}for(const claim of CLAIMS){if(!CROSS_STATUS.includes(row.cross_view[claim]))out.push("cross-view "+claim);if(row.cross_view[claim]==="unresolved")unresolved=true;}if((unresolved||row.reviewable==="no")&&!row.notes.trim())out.push("notes explaining unresolved/not-reviewable");return out;}

function render(){const entry=rows[position],packet=entry.packet,response=current();document.getElementById("itemMeta").textContent=entry.partition+" · "+packet.item_id;document.getElementById("findings").replaceChildren(...(packet.evidence.case_findings||[]).map(f=>textBox("finding",f.id+": "+f.text)));document.getElementById("claims").replaceChildren(...CLAIMS.map(c=>textBox("claim",c+": "+packet.evidence[c])));document.getElementById("view1").textContent=packet.view_1;document.getElementById("view2").textContent=packet.view_2;document.getElementById("reviewable").innerHTML=options(["yes","no"],response.reviewable);document.getElementById("needsAdjudication").innerHTML=options(["yes","no"],response.needs_adjudication);document.getElementById("raterId").value=raterId;document.getElementById("notes").value=response.notes;renderView("view1Form","view_1","View 1 ratings",response.view_1);renderView("view2Form","view_2","View 2 ratings",response.view_2);renderCross(response.cross_view);document.getElementById("jump").max=rows.length;document.getElementById("jump").value=position+1;document.getElementById("previous").disabled=position===0;document.getElementById("next").disabled=position===rows.length-1;updateHeader();status("");}
function renderView(target,key,title,value){const root=document.getElementById(target);root.innerHTML="<h3>"+title+"</h3>";const grid=document.createElement("div");grid.className="grid";for(const claim of CLAIMS){const box=document.createElement("div");box.className="field";box.innerHTML='<label>'+claim+' status</label><select data-path="'+key+'.'+claim+'_status">'+options(CLAIM_STATUS,value[claim+"_status"])+"</select>";grid.appendChild(box);}root.appendChild(grid);const choice=document.createElement("div");choice.className="field";choice.innerHTML='<label>Extra factual claim present</label><select data-path="'+key+'.extra_claim_present">'+options(["yes","no","unresolved"],value.extra_claim_present)+"</select>";root.appendChild(choice);value.extra_claims.forEach((extra,index)=>root.appendChild(extraEditor(key,index,extra)));const add=document.createElement("button");add.type="button";add.textContent="Add extra claim";add.onclick=()=>{saveVisible();current()[key].extra_claims.push({quote:"",status:"",reason:""});render();};root.appendChild(add);const flags=document.createElement("div");flags.className="field";flags.innerHTML="<label>Scope flags</label>";const checks=document.createElement("div");checks.className="checks";for(const flag of FLAGS){const label=document.createElement("label");label.innerHTML='<input type="checkbox" data-scope="'+key+'" value="'+flag+'"'+(value.scope_flags.includes(flag)?" checked":"")+"> "+flag;checks.appendChild(label);}flags.appendChild(checks);root.appendChild(flags);}
function extraEditor(key,index,value){const box=document.createElement("div");box.className="extra";box.innerHTML='<div class="field"><label>Quoted extra claim</label><textarea data-extra="'+key+'" data-index="'+index+'" data-extra-field="quote"></textarea></div><div class="field"><label>Status</label><select data-extra="'+key+'" data-index="'+index+'" data-extra-field="status">'+options(["supported","contradicted","unsupported","unresolved"],value.status)+'</select></div><div class="field"><label>Reason</label><textarea data-extra="'+key+'" data-index="'+index+'" data-extra-field="reason"></textarea></div>';box.querySelector('[data-extra-field="quote"]').value=value.quote;box.querySelector('[data-extra-field="reason"]').value=value.reason;const remove=document.createElement("button");remove.type="button";remove.className="danger";remove.textContent="Remove extra claim";remove.onclick=()=>{saveVisible();current()[key].extra_claims.splice(index,1);render();};box.appendChild(remove);return box;}
function renderCross(value){const root=document.getElementById("crossForm");root.innerHTML="<h3>Cross-view preservation</h3>";const grid=document.createElement("div");grid.className="grid";for(const claim of CLAIMS){const box=document.createElement("div");box.className="field";box.innerHTML='<label>'+claim+'</label><select data-cross="'+claim+'">'+options(CROSS_STATUS,value[claim])+"</select>";grid.appendChild(box);}root.appendChild(grid);}

function saveVisible(){if(!rows.length)return;const response=current();raterId=document.getElementById("raterId").value.trim();response.rater_id=raterId;response.reviewable=document.getElementById("reviewable").value;response.needs_adjudication=document.getElementById("needsAdjudication").value;response.notes=document.getElementById("notes").value;document.querySelectorAll("select[data-path]").forEach(n=>{const [view,field]=n.dataset.path.split(".");response[view][field]=n.value;});for(const key of ["view_1","view_2"]){response[key].scope_flags=[...document.querySelectorAll('input[data-scope="'+key+'"]:checked')].map(x=>x.value);document.querySelectorAll('[data-extra="'+key+'"]').forEach(n=>response[key].extra_claims[Number(n.dataset.index)][n.dataset.extraField]=n.value);}document.querySelectorAll("select[data-cross]").forEach(n=>response.cross_view[n.dataset.cross]=n.value);for(const row of Object.values(responses))row.rater_id=raterId;persistRaw();updateHeader();}
function updateHeader(){const done=rows.filter(x=>responses[x.packet.item_id]&&!errors(responses[x.packet.item_id]).length).length;document.getElementById("assignment").textContent="Rater "+ASSIGNMENT.rater_slot;document.getElementById("counter").textContent=(position+1)+" / "+rows.length;document.getElementById("completion").textContent=done+" complete";}
function download(name,type,data){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportPartition(partition){saveVisible();const selected=rows.filter(x=>x.partition===partition).map(x=>responses[x.packet.item_id]||blankResponse(x.packet)),invalid=selected.map((row,index)=>({index,errors:errors(row)})).filter(x=>x.errors.length);if(invalid.length){status("Cannot export: "+invalid.length+" incomplete rows. First problem at "+(invalid[0].index+1)+": "+invalid[0].errors.join(", "));return;}download(partition+"_RESPONSES.jsonl","application/x-ndjson",selected.map(x=>JSON.stringify(x)).join("\n")+"\n");status("Exported complete "+partition+" JSONL.",true);}
function restore(document){if(!sameKeys(document,["schema","rater_slot","packet_ids","rater_id","responses"])||document.schema!=="trustxai.step6.rater-form-progress.v1"||document.rater_slot!==ASSIGNMENT.rater_slot||!Array.isArray(document.packet_ids)||JSON.stringify([...document.packet_ids].sort())!==JSON.stringify(packetIds)||!Array.isArray(document.responses)||typeof document.rater_id!=="string")throw new Error("assignment or progress structure does not match");const incoming=Object.create(null);for(const row of document.responses){if(!bindingValid(row)||row.rater_id!==document.rater_id||incoming[row.item_id])throw new Error("response shape, binding, pseudonym or duplicate does not match");incoming[row.item_id]=row;}responses=incoming;raterId=document.rater_id;persistRaw();}

document.getElementById("previous").onclick=()=>{saveVisible();position=Math.max(0,position-1);render();};document.getElementById("next").onclick=()=>{saveVisible();const problems=errors(current());if(problems.length){status("Complete this row: "+problems.join(", "));return;}position=Math.min(rows.length-1,position+1);render();};document.getElementById("nextIncomplete").onclick=()=>{saveVisible();for(let offset=1;offset<=rows.length;offset++){const index=(position+offset)%rows.length,row=responses[rows[index].packet.item_id];if(!row||errors(row).length){position=index;render();return;}}status("All rows are complete.",true);};document.getElementById("jump").onchange=e=>{saveVisible();position=Math.max(0,Math.min(rows.length-1,(Number(e.target.value)||1)-1));render();};document.getElementById("partitionJump").onchange=e=>{if(!e.target.value)return;saveVisible();const index=rows.findIndex(x=>x.partition===e.target.value);if(index>=0)position=index;e.target.value="";render();};
document.getElementById("saveProgress").onclick=()=>{download("TRUSTXAI_RATER_"+ASSIGNMENT.rater_slot+"_PROGRESS.json","application/json",JSON.stringify(progress(),null,2)+"\n");status("Progress saved. Keep the file private.",true);};document.getElementById("exportDevelopment").onclick=()=>exportPartition("development");document.getElementById("exportTest").onclick=()=>exportPartition("test");document.getElementById("loadProgress").onchange=async e=>{try{const file=e.target.files[0];if(!file)return;restore(JSON.parse(await file.text()));render();status("Private progress restored.",true);}catch(error){status("Resume rejected: "+error.message);}finally{e.target.value="";}};
document.getElementById("responsePanel").addEventListener("change",saveVisible);let timer;document.getElementById("responsePanel").addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(saveVisible,250);});window.addEventListener("beforeunload",saveVisible);try{const saved=JSON.parse(localStorage.getItem(storageKey));if(saved)restore(saved);}catch(_error){}render();
</script>
</body>
</html>
